groups:
  - name: "UI"
    description: "React frontend components and pages"
  - name: "API"
    description: "HTTP API handlers and server functions"

overrides:
  - pattern: "src/components/**"
    group: "UI"
  - pattern: "src/pages/**"
    group: "UI"
  - pattern: "src/routes/**"
    group: "API"
  - pattern: "src/server/**"
    group: "API"
